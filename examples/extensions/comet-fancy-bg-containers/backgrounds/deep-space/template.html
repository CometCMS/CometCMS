<div class="cometcms-fbg cometcms-fbg--space cometcms-fbg--layer" data-variant="{{variant}}" data-intensity="{{intensity}}" data-motion="{{motion}}" data-scale="{{scale}}" style="--fbg-a: {{accent}}; --fbg-b: {{secondary}}">
  <div class="cometcms-fbg__effects">
    <span class="cometcms-fbg__nebula"></span>
    <span class="cometcms-fbg__stars cometcms-fbg__stars--near"></span>
    <span class="cometcms-fbg__stars cometcms-fbg__stars--far"></span>
    <span class="cometcms-fbg__orbit"></span>
  </div>
</div>
