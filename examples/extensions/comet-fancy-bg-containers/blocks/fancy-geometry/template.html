<div class="cometcms-fbg cometcms-fbg--geometry" data-variant="{{variant}}" data-intensity="{{intensity}}" data-motion="{{motion}}" data-scale="{{scale}}" data-padding="{{padding}}" data-height="{{height}}" data-align="{{align}}" style="--fbg-a: {{accent}}; --fbg-b: {{secondary}}">
  <div class="cometcms-fbg__effects" aria-hidden="true">
    <span class="cometcms-fbg__wash"></span>
    <span class="cometcms-fbg__shape cometcms-fbg__shape--one"></span>
    <span class="cometcms-fbg__shape cometcms-fbg__shape--two"></span>
    <span class="cometcms-fbg__shape cometcms-fbg__shape--three"></span>
    <span class="cometcms-fbg__shape cometcms-fbg__shape--four"></span>
    <span class="cometcms-fbg__shape cometcms-fbg__shape--five"></span>
  </div>
  <div class="cometcms-fbg__content"><slot></slot></div>
</div>
