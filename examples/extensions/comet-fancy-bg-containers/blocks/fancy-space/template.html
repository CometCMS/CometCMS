<div class="cometcms-fbg cometcms-fbg--space" data-variant="{{variant}}" data-intensity="{{intensity}}" data-motion="{{motion}}" data-scale="{{scale}}" data-padding="{{padding}}" data-height="{{height}}" data-align="{{align}}" style="--fbg-a: {{accent}}; --fbg-b: {{secondary}}">
  <div class="cometcms-fbg__effects" aria-hidden="true">
    <span class="cometcms-fbg__nebula"></span>
    <span class="cometcms-fbg__stars cometcms-fbg__stars--near"></span>
    <span class="cometcms-fbg__stars cometcms-fbg__stars--far"></span>
    <span class="cometcms-fbg__orbit"></span>
  </div>
  <div class="cometcms-fbg__content"><slot></slot></div>
</div>
