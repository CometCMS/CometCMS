<div class="cometcms-fbg cometcms-fbg--lights" data-variant="{{variant}}" data-intensity="{{intensity}}" data-motion="{{motion}}" data-scale="{{scale}}" data-padding="{{padding}}" data-height="{{height}}" data-align="{{align}}" style="--fbg-a: {{accent}}; --fbg-b: {{secondary}}">
  <div class="cometcms-fbg__effects" aria-hidden="true">
    <span class="cometcms-fbg__light cometcms-fbg__light--one"></span>
    <span class="cometcms-fbg__light cometcms-fbg__light--two"></span>
    <span class="cometcms-fbg__light cometcms-fbg__light--three"></span>
    <span class="cometcms-fbg__ribbon"></span>
  </div>
  <div class="cometcms-fbg__content"><slot></slot></div>
</div>
