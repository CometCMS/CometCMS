<div class="cometcms-fbg cometcms-fbg--grid" data-variant="{{variant}}" data-intensity="{{intensity}}" data-motion="{{motion}}" data-scale="{{scale}}" data-padding="{{padding}}" data-height="{{height}}" data-align="{{align}}" style="--fbg-a: {{accent}}; --fbg-b: {{secondary}}">
  <div class="cometcms-fbg__effects" aria-hidden="true">
    <span class="cometcms-fbg__wash"></span>
    <span class="cometcms-fbg__grid"></span>
    <span class="cometcms-fbg__horizon"></span>
    <span class="cometcms-fbg__scan"></span>
    <span class="cometcms-fbg__corners"></span>
  </div>
  <div class="cometcms-fbg__content"><slot></slot></div>
</div>
